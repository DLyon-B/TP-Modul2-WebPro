<!DOCTYPE html>
<html>
<head>
    <title>Layout Tabel TP 1</title>
</head>
<body>

    <!-- Full Table -->
    <table border="1" bordercolor="black" width="300" height="200" cellspacing="0" cellpadding="0">
        
        <tr align="center" height="100">
            <td width="100">A</td>
            
            <td colspan="2" width="200">
                
                <!-- Tabel Dalam -->
                <table border="2" width="100%" height="100%" cellspacing="0" cellpadding="0">
                    <tr align="center">
                        <td bgcolor="lightgray" width="50%">B</td>
                        <td width="50%">C</td>
                    </tr>
                    <tr align="center">
                        <td width="50%">D</td>
                        <td bgcolor="lightgray" width="50%">E</td>
                    </tr>
                </table>

            </td>
        </tr>
        
        <tr align="center" height="100">
            <td width="100"></td>
            <td width="100">F</td>
            <td width="100">G</td>
        </tr>

    </table>

</body>
</html>
